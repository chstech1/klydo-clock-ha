name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: pytest --cov=custom_components.klydo_clock --cov-report=term-missing
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Local brand assets ship with this custom repository (HA 2026.3+).
          # A separate home-assistant/brands submission is not needed for custom installs.
          ignore: brands
